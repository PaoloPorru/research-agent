<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<title>Research Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%235b5bff%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0f0ed;--ink:#13141a;--muted:#6b6f7b;--line:rgba(19,20,26,.09);
  --accent:#5b5bff;--accent-ink:#ffffff;--accent-soft:rgba(91,91,255,.10);--user:#ecebff;
  --ok:#14804a;--err:#c9302c;--shadow:0 1px 2px rgba(19,20,26,.04),0 8px 30px rgba(19,20,26,.06);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(122,108,255,.16),transparent 70%);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12;--surface:#12151c;--surface-2:#1a1e27;--ink:#eceef3;--muted:#8a90a0;--line:rgba(255,255,255,.08);
  --accent:#8b8bff;--accent-ink:#0b0d12;--accent-soft:rgba(139,139,255,.14);--user:#1c2040;
  --ok:#5ad197;--err:#ff8a84;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 40px rgba(0,0,0,.35);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(110,95,255,.22),transparent 70%);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d12;--surface:#12151c;--surface-2:#1a1e27;--ink:#eceef3;--muted:#8a90a0;--line:rgba(255,255,255,.08);
  --accent:#8b8bff;--accent-ink:#0b0d12;--accent-soft:rgba(139,139,255,.14);--user:#1c2040;
  --ok:#5ad197;--err:#ff8a84;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 40px rgba(0,0,0,.35);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(110,95,255,.22),transparent 70%);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--ink);
  font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* orb */
.orb{border-radius:50%;background:conic-gradient(from 200deg,#5b5bff,#a855f7,#ec4899,#f59e0b,#5b5bff);position:relative;flex:none}
.orb::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 60%)}
.orb.lg{width:76px;height:76px;box-shadow:0 12px 50px rgba(124,92,255,.45);animation:spin 14s linear infinite}
.orb.sm{width:26px;height:26px}
.orb.xs{width:22px;height:22px}
@keyframes spin{to{transform:rotate(360deg)}}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding:10px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-weight:600;letter-spacing:-.01em}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;min-width:38px;padding:0 10px;border:1px solid transparent;background:transparent;border-radius:12px;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.labeled{padding:0 13px;border-color:var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500}
.icon-btn.labeled:hover{background:var(--surface-2)}

/* chat */
main{flex:1;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:12px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.user{justify-content:flex-end}
.bubble-user{background:var(--user);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.row.bot .orb{margin-top:3px}
.bot-body{flex:1;min-width:0;font-size:16.5px;line-height:1.72}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .85em}
.md ul,.md ol{padding-left:1.35em;margin:0 0 .85em}.md li{margin:.25em 0}
.md a{color:var(--accent);text-underline-offset:3px}
.md h1,.md h2,.md h3{font-size:1.05em;margin:1.2em 0 .4em;letter-spacing:-.01em}
.md code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.15em .4em;border-radius:6px}
.md pre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:14px}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 .85em;padding-left:14px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}.md th,.md td{border:1px solid var(--line);padding:5px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--mono);font-weight:500;color:var(--accent)}
a.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.mem{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:2px;margin-top:8px;margin-left:-8px}
.actions .icon-btn{height:30px;min-width:30px;border-radius:9px;font-size:12.5px}
.err-msg{color:var(--err);font-size:15px}
.saved{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:500}
.typing{display:inline-flex;gap:5px;padding:10px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* hero */
.hero{text-align:center;padding:9vh 6px 0;display:flex;flex-direction:column;align-items:center;gap:18px;animation:rise .5s ease both}
.hero h2{margin:6px 0 0;font:400 clamp(34px,7vw,46px)/1.08 var(--serif);letter-spacing:-.01em}
.hero h2 em{font-style:italic;background:linear-gradient(90deg,#6f6bff,#c04dff,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);max-width:420px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%;margin-top:14px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--shadow)}
.card .i{color:var(--accent)}
.card strong{font-weight:600;font-size:14.5px}
.card span{font-size:13px;color:var(--muted);line-height:1.4}

/* composer */
.dock{padding:6px 14px calc(12px + env(safe-area-inset-bottom));position:relative}
.dock::before{content:"";position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:10px 10px 10px 16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.composer textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;max-height:180px;padding:6px 0;line-height:1.5}
.composer textarea::placeholder{color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px;margin-top:4px}
.tools .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;transition:all .15s}
.pill:hover{color:var(--ink);background:var(--surface-2)}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.send{width:40px;height:40px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);transition:transform .15s,opacity .15s}
.send:not(:disabled):hover{transform:scale(1.06)}
.send .i{width:19px;height:19px;stroke-width:2.2}
.foot{max-width:760px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}

/* login */
#login{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg);background-image:var(--glow);background-repeat:no-repeat}
#login form{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#login h2{margin:8px 0 0;font:400 38px/1.1 var(--serif)}
#login p{margin:0;color:var(--muted);font-size:14.5px}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;outline:0}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent;width:100%}
.btn:not(:disabled):hover{filter:brightness(1.06)}

/* sheet */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);margin:0;max-width:100%;max-height:100%;overflow:hidden}
dialog::backdrop{background:rgba(8,9,14,.5);backdrop-filter:blur(3px)}
dialog[open]{display:flex;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes drawer{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#memDlg{width:100%;height:92dvh;margin-top:auto;border-radius:24px 24px 0 0;border-top:1px solid var(--line)}
@media(min-width:760px){#memDlg{width:460px;height:100dvh;margin:0 0 0 auto;border-radius:24px 0 0 24px;border:1px solid var(--line);border-right:0}dialog[open]{animation-name:drawer}}
.sheet{outline:0;display:flex;flex-direction:column;width:100%;height:100%}
.sheet-h{display:flex;align-items:center;gap:8px;padding:16px 16px 6px}
.sheet-h h3{margin:0;flex:1;font-size:18px;letter-spacing:-.01em}
.sheet-b{flex:1;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel{display:flex;flex-direction:column;gap:10px}
.panel[hidden]{display:none}
.panel textarea.field{min-height:110px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.drop{border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:18px;padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop .i{width:26px;height:26px;color:var(--accent)}
.drop input{display:none}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:20px}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite}
.sec-t{margin:4px 0 -4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px}
.item>.i{margin-top:3px;color:var(--accent)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px;line-height:1.45}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.item .icon-btn{height:30px;min-width:30px;padding:0;border-radius:9px}
.item .icon-btn:hover{color:var(--err)}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:13.5px}

/* toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);animation:rise .25s ease both}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.icon-btn.labeled .lbl{display:none}.icon-btn.labeled{padding:0 10px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 4 5.7 4 9s-1.4 6.3-4 9c-2.6-2.7-4-5.7-4-9s1.4-6.3 4-9z"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4M8 9h8M8 13h4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>

<div id="login">
  <form id="loginForm">
    <div class="orb lg"></div>
    <h2>Research Agent</h2>
    <p id="loginMsg">Inserisci la password per entrare.</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button class="btn primary" type="submit">Entra</button>
  </form>
</div>

<header class="top">
  <div class="brand"><span class="orb sm"></span><span>Research Agent</span></div>
  <button class="icon-btn labeled" id="memBtn" type="button"><svg class="i"><use href="#i-stack"/></svg><span class="lbl">Memoria</span></button>
  <button class="icon-btn" id="themeBtn" type="button" title="Cambia tema" aria-label="Cambia tema"><svg class="i"><use href="#i-moon"/></svg></button>
  <button class="icon-btn" id="newBtn" type="button" title="Nuova chat" aria-label="Nuova chat"><svg class="i"><use href="#i-plus"/></svg></button>
</header>

<main id="main"><div class="wrap" id="chat"></div></main>

<div class="dock">
  <form class="composer" id="form">
    <textarea id="q" rows="1" placeholder="Chiedi o scrivi «ricorda: …»" aria-label="Messaggio"></textarea>
    <div class="tools">
      <button class="pill on" id="webBtn" type="button" aria-pressed="true"><svg class="i"><use href="#i-globe"/></svg>Web</button>
      <span class="sp"></span>
      <button class="send" id="send" type="submit" aria-label="Invia"><svg class="i"><use href="#i-up"/></svg></button>
    </div>
  </form>
  <div class="foot">I modelli gratuiti possono sbagliare: verifica i dati importanti.</div>
</div>

<dialog id="memDlg" aria-labelledby="memTitle">
  <div class="sheet" tabindex="-1" autofocus>
    <div class="sheet-h"><h3 id="memTitle">Memoria</h3><button class="icon-btn" id="memClose" type="button" aria-label="Chiudi"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="sheet-b">
      <div class="banner" id="memWarn" hidden></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="note"><svg class="i"><use href="#i-pen"/></svg>Nota</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="file"><svg class="i"><use href="#i-file"/></svg>File</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="google"><svg class="i"><use href="#i-link"/></svg>Google</button>
      </div>
      <section class="panel" data-panel="note">
        <textarea class="field" id="noteText" placeholder="Es. Il cliente Rossi preferisce preventivi in PDF e paga a 60 giorni."></textarea>
        <button class="btn primary" id="noteSave" type="button">Salva nota</button>
      </section>
      <section class="panel" data-panel="file" hidden>
        <label class="drop" id="drop"><svg class="i"><use href="#i-upload"/></svg><strong>Trascina qui o tocca per scegliere</strong><span class="hint">PDF, TXT, MD, CSV · il testo viene letto nel tuo browser</span>
          <input id="files" type="file" multiple accept=".pdf,.txt,.md,.csv,.json,.html,text/plain,application/pdf"></label>
      </section>
      <section class="panel" data-panel="google" hidden>
        <input class="field" id="gurl" type="url" placeholder="https://docs.google.com/document/d/…">
        <button class="btn primary" id="gSave" type="button">Importa</button>
        <div class="hint">Docs, Sheets o Slides condivisi con «Chiunque abbia il link».</div>
      </section>
      <div class="status" id="status" role="status"></div>
      <div class="sec-t">Ricordi salvati</div>
      <div class="items" id="items"></div>
    </div>
  </div>
</dialog>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ic=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>';
const chatEl=$('#chat'),main=$('#main'),q=$('#q'),sendBtn=$('#send'),form=$('#form');
let pw=localStorage.getItem('ra_pw')||'';
let webOn=localStorage.getItem('ra_web')!=='0';
let history=[];try{history=JSON.parse(localStorage.getItem('ra_chat')||'[]')}catch{}
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- utilità ---------- */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2200)}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}}
function scrollDown(){main.scrollTo({top:main.scrollHeight})}

/* ---------- tema ---------- */
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
applyTheme(localStorage.getItem('ra_theme'));
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';localStorage.setItem('ra_theme',next);applyTheme(next)
};

/* ---------- API ---------- */
async function api(path,{method='GET',body}={}){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-App-Password':pw},body:body?JSON.stringify(body):undefined});
  let data={};try{data=await r.json()}catch{}
  if(r.status===401){showLogin(data.detail);throw new Error(data.detail||'Non autorizzato')}
  if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:('Errore '+r.status));
  return data;
}

/* ---------- login ---------- */
function showLogin(msg){$('#login').style.display='flex';if(msg)$('#loginMsg').textContent=msg;$('#pw').focus()}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();pw=$('#pw').value;
  try{await api('/api/me');localStorage.setItem('ra_pw',pw);$('#login').style.display='none';$('#pw').value=''}
  catch(err){$('#loginMsg').textContent=err.message}
});
async function boot(){try{await api('/api/me')}catch(err){if(!pw)showLogin('Inserisci la password per entrare.')}}

/* ---------- chat ---------- */
function setWeb(v){webOn=v;localStorage.setItem('ra_web',v?'1':'0');$('#webBtn').classList.toggle('on',v);$('#webBtn').setAttribute('aria-pressed',v)}
$('#webBtn').onclick=()=>{setWeb(!webOn);toast(webOn?'Ricerca web attiva':'Ricerca web disattivata')};setWeb(webOn);
$('#newBtn').onclick=()=>{if(history.length&&!confirm('Iniziare una nuova chat?'))return;history=[];saveHist();renderAll()};
function saveHist(){localStorage.setItem('ra_chat',JSON.stringify(history.slice(-40)))}
function md(el,text){el.innerHTML=DOMPurify.sanitize(marked.parse(text));el.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})}

function userRow(text){
  document.getElementById('hero')?.remove();
  const r=document.createElement('div');r.className='row user';
  const b=document.createElement('div');b.className='bubble-user';b.textContent=text;r.appendChild(b);
  chatEl.appendChild(r);scrollDown();return r;
}
function botRow(){
  document.getElementById('hero')?.remove();
  const r=document.createElement('div');r.className='row bot';
  r.innerHTML='<span class="orb xs"></span><div class="bot-body"><div class="md"></div></div>';
  chatEl.appendChild(r);return r;
}
function setBot(row,text){md(row.querySelector('.md'),text)}
function addActions(row,text){
  const a=document.createElement('div');a.className='actions';
  const b=document.createElement('button');b.type='button';b.className='icon-btn';b.title='Copia';b.setAttribute('aria-label','Copia risposta');b.innerHTML=ic('copy');
  b.onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Copiato')}catch{toast('Copia non riuscita')}};
  a.appendChild(b);row.querySelector('.bot-body').appendChild(a);
}
function addSources(row,res){
  const body=row.querySelector('.bot-body');
  const mem=res.memory||[],web=res.web||[];
  if(mem.length||web.length){
    const c=document.createElement('div');c.className='chips';
    mem.forEach(m=>{const s=document.createElement('span');s.className='chip mem';s.innerHTML=ic('stack');
      const b=document.createElement('b');b.textContent=m.ref;s.append(b,' '+m.source);c.appendChild(s)});
    web.forEach(w=>{const a=document.createElement('a');a.className='chip';a.href=w.url;a.target='_blank';a.rel='noopener noreferrer';a.title=w.title;
      const b=document.createElement('b');b.textContent=w.ref;a.append(b,' '+host(w.url));c.appendChild(a)});
    body.appendChild(c);
  }
  (res.warnings||[]).forEach(w=>{const n=document.createElement('div');n.className='warn';n.innerHTML=ic('warn');const s=document.createElement('span');s.textContent=w;n.appendChild(s);body.appendChild(n)});
}
const SUGGEST=[
  {i:'pen',t:'Ricorda qualcosa',s:'«ricorda: il cliente Rossi paga a 60 giorni»',v:'ricorda: '},
  {i:'stack',t:'Interroga la memoria',s:'Riassumi cosa sai del progetto…',v:'Riassumi cosa sai del progetto '},
  {i:'search',t:'Cerca sul web',s:'Ultime novità su un tema, con fonti',v:'Cerca le ultime novità su '}
];
function renderAll(){
  chatEl.innerHTML='';
  if(!history.length){
    const d=document.createElement('div');d.className='hero';d.id='hero';
    d.innerHTML='<div class="orb lg"></div><h2>Ciao, su cosa <em>lavoriamo</em> oggi?</h2><p>Cerco sul web, ricordo quello che mi insegni e unisco tutto in una risposta con le fonti.</p><div class="cards"></div>';
    SUGGEST.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='card';
      b.innerHTML=ic(s.i)+'<strong></strong><span></span>';b.querySelector('strong').textContent=s.t;b.querySelector('span').textContent=s.s;
      b.onclick=()=>{q.value=s.v;q.dispatchEvent(new Event('input'));q.focus()};d.querySelector('.cards').appendChild(b)});
    chatEl.appendChild(d);return;
  }
  history.forEach(h=>{if(h.role==='user')userRow(h.content);else{const r=botRow();setBot(r,h.content);addActions(r,h.content)}});
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const message=q.value.trim();if(!message||sendBtn.disabled)return;
  q.value='';q.style.height='auto';sendBtn.disabled=true;
  userRow(message);
  const row=botRow();row.querySelector('.md').innerHTML='<span class="typing"><i></i><i></i><i></i></span>';scrollDown();
  try{
    const res=await api('/api/chat',{method:'POST',body:{message,history,web:webOn}});
    if(res.saved){row.querySelector('.md').innerHTML='<span class="saved">'+ic('check')+'Memorizzato</span>'}
    else{setBot(row,res.answer);addActions(row,res.answer)}
    addSources(row,res);
    history.push({role:'user',content:message},{role:'assistant',content:res.answer});saveHist();
  }catch(err){const m=row.querySelector('.md');m.className='md err-msg';m.textContent=err.message}
  finally{sendBtn.disabled=false;scrollDown();q.focus()}
});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,180)+'px'});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(hover:hover)').matches){e.preventDefault();form.requestSubmit()}});

/* ---------- memoria ---------- */
const dlg=$('#memDlg'),statusEl=$('#status');
function status(t,kind){statusEl.className='status'+(kind?' '+kind:'');statusEl.innerHTML=(kind==='busy'?'<span class="spin"></span>':'');const s=document.createElement('span');s.textContent=t||'';statusEl.appendChild(s)}
$('#memBtn').onclick=()=>{dlg.showModal();status('');loadMem()};
$('#memClose').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.panel!==t.dataset.tab);
});
async function loadMem(){
  const box=$('#items');box.textContent='';
  try{
    const me=await api('/api/me');
    $('#memWarn').hidden=me.memory;
    if(!me.memory){$('#memWarn').textContent='Memoria non configurata: mancano SUPABASE_URL e SUPABASE_SERVICE_KEY su Vercel.';return}
    const d=await api('/api/memories');
    const all=[...d.notes,...d.documents];
    if(!all.length){box.innerHTML='<div class="hint">Ancora niente: aggiungi una nota, un file o un link.</div>';return}
    all.forEach(x=>{
      const it=document.createElement('div');it.className='item';
      it.insertAdjacentHTML('beforeend',ic(x.type==='nota'?'note':'file'));
      const t=document.createElement('div');t.className='t';t.textContent=x.label;
      const s=document.createElement('small');s.textContent=(x.type==='nota'?'Nota':x.chunks+' parti')+' · '+new Date(x.created_at).toLocaleDateString('it-IT');t.appendChild(s);
      const del=document.createElement('button');del.type='button';del.className='icon-btn';del.title='Elimina';del.setAttribute('aria-label','Elimina');del.innerHTML=ic('trash');
      del.onclick=async()=>{if(!confirm('Eliminare questo elemento?'))return;
        try{await api('/api/memories?'+(x.type==='nota'?'id='+x.id:'source='+encodeURIComponent(x.source)),{method:'DELETE'});toast('Eliminato');loadMem()}catch(e){status(e.message,'err')}};
      it.append(t,del);box.appendChild(it);
    });
  }catch(err){status(err.message,'err')}
}
$('#noteSave').onclick=async()=>{
  const t=$('#noteText').value.trim();if(!t)return;
  try{await api('/api/memories/note',{method:'POST',body:{text:t}});$('#noteText').value='';status('Nota salvata.','ok');loadMem()}catch(e){status(e.message,'err')}
};
$('#gSave').onclick=async()=>{
  const url=$('#gurl').value.trim();if(!url)return;
  status('Importo dal link…','busy');
  try{const r=await api('/api/memories/url',{method:'POST',body:{url}});$('#gurl').value='';status('Importato «'+r.name+'» ('+r.chunks+' parti).','ok');loadMem()}catch(e){status(e.message,'err')}
};
async function pdfText(file){
  if(!window.pdfjsLib)throw new Error('lettore PDF non caricato: ricarica la pagina');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const c=await (await pdf.getPage(i)).getTextContent();
    pages.push(c.items.map(x=>x.str).join(' '));
    status('Leggo '+file.name+' · pagina '+i+'/'+pdf.numPages,'busy');
  }
  return pages.join('\n\n');
}
async function handleFiles(list){
  const files=[...list];
  for(const f of files){
    try{
      status('Leggo '+f.name+'…','busy');
      const text=/\.pdf$/i.test(f.name)||f.type==='application/pdf'?await pdfText(f):await f.text();
      if(!text.trim())throw new Error('nessun testo trovato (PDF scansionato?)');
      const SIZE=1500000;let first=true,chunks=0;
      for(let i=0;i<text.length;i+=SIZE){
        status('Salvo '+f.name+'…','busy');
        const r=await api('/api/memories/document',{method:'POST',body:{name:f.name,text:text.slice(i,i+SIZE),replace:first}});
        first=false;chunks+=r.chunks;
      }
      status('Salvato «'+f.name+'» ('+chunks+' parti).','ok');
    }catch(err){status(f.name+': '+err.message,'err');break}
  }
  loadMem();
}
$('#files').onchange=e=>{const f=e.target.files;handleFiles(f);e.target.value=''};
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length)handleFiles(e.dataTransfer.files)});

renderAll();boot();
</script>
</body>
</html>
