<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Research Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #171717;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 42px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: vertical;
            font-size: 16px;
            font-family: inherit;
        }

        button {
            margin-top: 15px;
            padding: 12px 22px;
            border: 0;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            color: #666;
        }

        #answer {
            margin-top: 30px;
            background: white;
            border-radius: 14px;
            padding: 25px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Research Agent</h1>

    <div class="subtitle">
        Fai una domanda e lascia che l'agente ricerchi il web.
    </div>

    <textarea
        id="question"
        placeholder="Es. Quali sono le ultime novità su Shopify?"
    ></textarea>

    <button id="askButton">
        Cerca
    </button>

    <div id="status"></div>

    <div id="answer" class="hidden"></div>

</div>

<script>
    const questionInput = document.getElementById("question");
    const askButton = document.getElementById("askButton");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");

    askButton.addEventListener("click", async () => {

        const question = questionInput.value.trim();

        if (!question) {
            status.textContent = "Inserisci una domanda.";
            return;
        }

        askButton.disabled = true;
        status.textContent = "Ricerca in corso...";
        answer.classList.add("hidden");
        answer.textContent = "";

        try {

            const response = await fetch("/api/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Errore durante la ricerca."
                );
            }

            answer.textContent = data.answer;
            answer.classList.remove("hidden");
            status.textContent = "Ricerca completata.";

        } catch (error) {

            status.textContent = `Errore: ${error.message}`;

        } finally {

            askButton.disabled = false;

        }
    });
</script>

</body>
</html>
