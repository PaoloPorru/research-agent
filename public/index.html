<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16202a;--muted:#667380;--line:#dde2e8;--accent:#1f5eff;--user:#e8eefc;--err:#b3261e;--ok:#1b7f4c}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--panel:#171e26;--ink:#e6ebf0;--muted:#8b97a4;--line:#27313c;--accent:#6c97ff;--user:#1d2a44;--err:#f2867f;--ok:#58c58c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:17px;font-weight:650;flex:1;white-space:nowrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--err)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:18px 16px}
.wrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:88%;white-space:pre-wrap}
.msg.bot{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:17px;line-height:1.65}
.msg.bot p{margin:0 0 .8em}.msg.bot ul,.msg.bot ol{padding-left:1.3em}
.msg.bot a{color:var(--accent)}
.msg.bot pre{overflow-x:auto;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:8px;font-size:14px}
.msg.err{color:var(--err);font-family:system-ui,sans-serif;font-size:15px}
.note{font:13px/1.4 system-ui,sans-serif;color:var(--muted);margin-top:4px}
.note.ok{color:var(--ok)}
details.src{margin-top:6px;font:14px/1.5 system-ui,sans-serif;color:var(--muted)}
details.src summary{cursor:pointer}
details.src ul{margin:6px 0 0;padding-left:1.2em}
details.src a{color:var(--accent);word-break:break-word}
.empty{color:var(--muted);text-align:center;margin-top:10vh;padding:0 10px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.hints{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:16px}
.hints button{max-width:100%}
.dots{color:var(--muted);font:14px system-ui,sans-serif}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
form.composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px}
.row{max-width:740px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea.in{flex:1;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:160px;width:100%}
input.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.send{padding:10px 18px;border-radius:12px}
/* login */
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0;font-size:22px}
/* memoria */
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);width:min(680px,100%);max-width:100%;height:100%;max-height:100%;margin:0 auto}
@media(min-width:720px){dialog{height:min(86vh,760px);border-radius:16px;margin:auto;border:1px solid var(--line)}}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg header{position:sticky;top:0}
.dlg .body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px}
.sec h3{margin:0 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sec .stack{display:flex;flex-direction:column;gap:8px}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.item .t{flex:1;overflow-wrap:anywhere}
.item small{color:var(--muted);display:block}
.item button{border:0;background:none;color:var(--err);cursor:pointer;padding:2px 6px}
.status{font-size:14px;min-height:1.3em}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm">
    <h2>🧠 Research Agent</h2>
    <div class="note" id="loginMsg">Inserisci la password per entrare.</div>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button class="btn primary" type="submit">Entra</button>
  </form>
</div>

<header>
  <h1>🧠 Research Agent</h1>
  <button class="btn on" id="webBtn" type="button" aria-pressed="true">🌐 Web</button>
  <button class="btn" id="memBtn" type="button">📚 Memoria</button>
  <button class="btn" id="newBtn" type="button" title="Nuova chat">＋</button>
</header>
<main id="main"><div class="wrap" id="chat"></div></main>
<form class="composer" id="form">
  <div class="row">
    <textarea class="in" id="q" rows="1" placeholder="Chiedi qualcosa, o scrivi «ricorda: …»" aria-label="Messaggio"></textarea>
    <button class="btn primary send" id="send" type="submit">Invia</button>
  </div>
</form>

<dialog id="memDlg">
  <div class="dlg">
    <header><h1>📚 Memoria</h1><button class="btn" id="memClose" type="button">Chiudi</button></header>
    <div class="body">
      <div class="note" id="memWarn" hidden></div>
      <section class="sec"><h3>Nuova nota</h3><div class="stack">
        <textarea class="in" id="noteText" rows="3" placeholder="Es. Il cliente Rossi preferisce preventivi in PDF, scadenza sempre al 30."></textarea>
        <button class="btn primary" id="noteSave" type="button">Salva nota</button>
      </div></section>
      <section class="sec"><h3>Carica documenti</h3><div class="stack">
        <input class="in" id="files" type="file" multiple accept=".pdf,.txt,.md,.csv,.json,.html,text/plain,application/pdf">
        <div class="note">PDF, TXT, MD, CSV. Il testo viene estratto nel tuo browser.</div>
      </div></section>
      <section class="sec"><h3>Da Google Docs / Sheets / Slides</h3><div class="stack">
        <input class="in" id="gurl" type="url" placeholder="https://docs.google.com/document/d/…">
        <button class="btn" id="gSave" type="button">Importa</button>
        <div class="note">Il file deve essere condiviso con «Chiunque abbia il link».</div>
      </div></section>
      <div class="status" id="status" role="status"></div>
      <section class="sec"><h3>Ricordi salvati</h3><div class="items" id="items"></div></section>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const chatEl=$('#chat'),main=$('#main'),q=$('#q'),sendBtn=$('#send'),form=$('#form');
let pw=localStorage.getItem('ra_pw')||'';
let webOn=localStorage.getItem('ra_web')!=='0';
let history=[];try{history=JSON.parse(localStorage.getItem('ra_chat')||'[]')}catch{}
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- API ---------- */
async function api(path,{method='GET',body}={}){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-App-Password':pw},body:body?JSON.stringify(body):undefined});
  let data={};try{data=await r.json()}catch{}
  if(r.status===401){showLogin(data.detail);throw new Error(data.detail||'Non autorizzato')}
  if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:('Errore '+r.status));
  return data;
}

/* ---------- login ---------- */
function showLogin(msg){$('#login').style.display='flex';if(msg)$('#loginMsg').textContent=msg;$('#pw').focus()}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();pw=$('#pw').value;
  try{await api('/api/me');localStorage.setItem('ra_pw',pw);$('#login').style.display='none';$('#pw').value=''}
  catch(err){$('#loginMsg').textContent=err.message}
});
async function boot(){
  try{await api('/api/me')}catch(err){if(!pw)showLogin('Inserisci la password per entrare.')}
}

/* ---------- chat ---------- */
function setWeb(v){webOn=v;localStorage.setItem('ra_web',v?'1':'0');$('#webBtn').classList.toggle('on',v);$('#webBtn').setAttribute('aria-pressed',v)}
$('#webBtn').onclick=()=>setWeb(!webOn);setWeb(webOn);
$('#newBtn').onclick=()=>{if(history.length&&!confirm('Iniziare una nuova chat?'))return;history=[];saveHist();renderAll()};
function saveHist(){localStorage.setItem('ra_chat',JSON.stringify(history.slice(-40)))}
function md(el,text){el.innerHTML=DOMPurify.sanitize(marked.parse(text));el.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})}
function addMsg(role,text){
  document.getElementById('empty')?.remove();
  const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'bot');
  if(role==='user')el.textContent=text;else md(el,text);
  chatEl.appendChild(el);main.scrollTop=main.scrollHeight;return el;
}
function addSources(el,res){
  const mem=res.memory||[],web=res.web||[];
  if(mem.length||web.length){
    const d=document.createElement('details');d.className='src';
    d.innerHTML='<summary>Fonti ('+(mem.length+web.length)+')</summary>';
    const ul=document.createElement('ul');
    mem.forEach(m=>{const li=document.createElement('li');li.textContent='['+m.ref+'] Memoria: '+m.source;ul.appendChild(li)});
    web.forEach(w=>{const li=document.createElement('li'),a=document.createElement('a');
      li.append('['+w.ref+'] ');a.href=w.url;a.textContent=w.title;a.target='_blank';a.rel='noopener noreferrer';li.appendChild(a);ul.appendChild(li)});
    d.appendChild(ul);el.appendChild(d);
  }
  (res.warnings||[]).forEach(w=>{const n=document.createElement('div');n.className='note';n.textContent='⚠ '+w;el.appendChild(n)});
}
function renderAll(){
  chatEl.innerHTML='';
  if(!history.length){
    const d=document.createElement('div');d.className='empty';d.id='empty';
    d.innerHTML='<b>Come posso aiutarti?</b>Ricerco sul web e uso la tua memoria.<div class="hints"></div>';
    ['ricorda: il mio cliente principale è …','Riassumi cosa sai del progetto …','Cerca le ultime novità su …'].forEach(t=>{
      const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=t;
      b.onclick=()=>{q.value=t;q.focus()};d.querySelector('.hints').appendChild(b)});
    chatEl.appendChild(d);return;
  }
  history.forEach(h=>addMsg(h.role,h.content));
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const message=q.value.trim();if(!message||sendBtn.disabled)return;
  q.value='';q.style.height='auto';sendBtn.disabled=true;
  addMsg('user',message);
  const bot=document.createElement('div');bot.className='msg bot';bot.innerHTML='<span class="dots">Penso</span>';
  chatEl.appendChild(bot);main.scrollTop=main.scrollHeight;
  try{
    const res=await api('/api/chat',{method:'POST',body:{message,history,web:webOn}});
    md(bot,res.answer);addSources(bot,res);
    if(res.saved){const n=document.createElement('div');n.className='note ok';n.textContent='Salvato nella memoria.';bot.appendChild(n)}
    history.push({role:'user',content:message},{role:'assistant',content:res.answer});saveHist();
  }catch(err){bot.className='msg err';bot.textContent='Errore: '+err.message}
  finally{sendBtn.disabled=false;main.scrollTop=main.scrollHeight;q.focus()}
});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px'});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(hover:hover)').matches){e.preventDefault();form.requestSubmit()}});

/* ---------- memoria ---------- */
const dlg=$('#memDlg'),statusEl=$('#status');
function status(t,ok){statusEl.textContent=t;statusEl.style.color=ok===false?'var(--err)':ok?'var(--ok)':'var(--muted)'}
$('#memBtn').onclick=async()=>{dlg.showModal();status('');loadMem()};
$('#memClose').onclick=()=>dlg.close();
async function loadMem(){
  const box=$('#items');box.textContent='Carico…';
  try{
    const me=await api('/api/me');
    $('#memWarn').hidden=me.memory;if(!me.memory)$('#memWarn').textContent='⚠ Memoria non configurata: mancano SUPABASE_URL e SUPABASE_SERVICE_KEY su Vercel.';
    if(!me.memory){box.textContent='';return}
    const d=await api('/api/memories');box.textContent='';
    const all=[...d.notes,...d.documents];
    if(!all.length){box.innerHTML='<div class="note">Ancora niente. Aggiungi una nota o un documento.</div>';return}
    all.forEach(x=>{
      const it=document.createElement('div');it.className='item';
      const t=document.createElement('div');t.className='t';
      t.textContent=(x.type==='nota'?'📝 ':'📄 ')+x.label;
      const s=document.createElement('small');s.textContent=(x.type==='nota'?'Nota':x.chunks+' parti')+' · '+new Date(x.created_at).toLocaleDateString('it-IT');t.appendChild(s);
      const del=document.createElement('button');del.type='button';del.textContent='✕';del.title='Elimina';del.setAttribute('aria-label','Elimina');
      del.onclick=async()=>{if(!confirm('Eliminare questo elemento?'))return;
        try{await api('/api/memories?'+(x.type==='nota'?'id='+x.id:'source='+encodeURIComponent(x.source)),{method:'DELETE'});loadMem()}catch(e){status(e.message,false)}};
      it.append(t,del);box.appendChild(it);
    });
  }catch(err){box.textContent='';status(err.message,false)}
}
$('#noteSave').onclick=async()=>{
  const t=$('#noteText').value.trim();if(!t)return;
  try{await api('/api/memories/note',{method:'POST',body:{text:t}});$('#noteText').value='';status('Nota salvata.',true);loadMem()}catch(e){status(e.message,false)}
};
$('#gSave').onclick=async()=>{
  const url=$('#gurl').value.trim();if(!url)return;
  status('Importo…');
  try{const r=await api('/api/memories/url',{method:'POST',body:{url}});$('#gurl').value='';status('Importato «'+r.name+'» ('+r.chunks+' parti).',true);loadMem()}catch(e){status(e.message,false)}
};
async function pdfText(file){
  if(!window.pdfjsLib)throw new Error('Lettore PDF non caricato: ricarica la pagina.');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const c=await (await pdf.getPage(i)).getTextContent();
    pages.push(c.items.map(x=>x.str).join(' '));
    status('Leggo '+file.name+': pagina '+i+'/'+pdf.numPages+'…');
  }
  return pages.join('\n\n');
}
$('#files').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  for(const f of files){
    try{
      status('Leggo '+f.name+'…');
      const text=/\.pdf$/i.test(f.name)||f.type==='application/pdf'?await pdfText(f):await f.text();
      if(!text.trim())throw new Error('nessun testo trovato (PDF scansionato?)');
      const SIZE=1500000;let first=true,chunks=0;
      for(let i=0;i<text.length;i+=SIZE){
        status('Salvo '+f.name+'…');
        const r=await api('/api/memories/document',{method:'POST',body:{name:f.name,text:text.slice(i,i+SIZE),replace:first}});
        first=false;chunks+=r.chunks;
      }
      status('Salvato «'+f.name+'» ('+chunks+' parti).',true);
    }catch(err){status(f.name+': '+err.message,false);break}
  }
  loadMem();
};

renderAll();boot();
</script>
</body>
</html>
